name: Append TVBox APIs

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run append script
        run: python scripts/append_tvbox.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: append tvbox APIs $(date -u +%Y-%m-%d)"
            git push
          fi
